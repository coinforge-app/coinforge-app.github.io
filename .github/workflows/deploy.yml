name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional default RPCs (e.g. Helius) baked into the public bundle — restrict the key to your domain
          VITE_RPC_MAINNET: ${{ vars.VITE_RPC_MAINNET }}
          VITE_RPC_DEVNET: ${{ vars.VITE_RPC_DEVNET }}
          # Optional platform fee — set as repository variables (Settings → Secrets and variables → Actions → Variables)
          VITE_FEE_WALLET: ${{ vars.VITE_FEE_WALLET }}
          VITE_FEE_SOL: ${{ vars.VITE_FEE_SOL }}
          VITE_FEE_ADDON_SOL: ${{ vars.VITE_FEE_ADDON_SOL }}
          # Homepage promotions (defaults: 0.05 SOL for 24h)
          VITE_PROMO_SOL: ${{ vars.VITE_PROMO_SOL }}
          VITE_PROMO_HOURS: ${{ vars.VITE_PROMO_HOURS }}
          VITE_PROMO_BLOCKLIST: ${{ vars.VITE_PROMO_BLOCKLIST }}
          # Referral share of every fee (default 30, max 50)
          VITE_REF_PERCENT: ${{ vars.VITE_REF_PERCENT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
